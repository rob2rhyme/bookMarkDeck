<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Bookmark Deck</title>
    <style>
      /* Outside Tailwind's reach, and served by the service worker before any
         app JS runs — so it follows the OS rather than the saved preference. */
      :root {
        color-scheme: dark;
        --bg: #020617; --fg: #e2e8f0; --muted: #94a3b8;
        --card: rgba(15,23,42,0.9); --line: rgba(148,163,184,0.18);
        --accent: #2563eb;
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #f8fafc; --fg: #0f172a; --muted: #64748b;
          --card: #ffffff; --line: rgba(100,116,139,0.22);
          --accent: #2563eb;
        }
      }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: var(--bg); color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        text-align: center; padding: 24px;
      }
      .card {
        max-width: 360px; border: 1px solid var(--line);
        background: var(--card); border-radius: 16px; padding: 28px 24px;
      }
      img { width: 56px; height: 56px; border-radius: 10px; }
      h1 { font-size: 18px; margin: 16px 0 6px; }
      p { font-size: 14px; color: var(--muted); line-height: 1.6; margin: 0 0 18px; }
      button {
        border: none; border-radius: 999px; padding: 10px 20px;
        background: var(--accent); color: #fff; font-size: 14px; font-weight: 500; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/logo.png" alt="Bookmark Deck" />
      <h1>You're offline</h1>
      <p>Bookmark Deck needs a connection to load this page. Your saved data is safe — reconnect to pick up where you left off.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
