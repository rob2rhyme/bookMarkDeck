version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Scoped to the broken versions, NOT the packages: a bare dependency-name
    # would silence the release that fixes it too. 4.1.12 and 8.6/9.x still
    # open a PR, which is exactly when to re-check whether the blocker cleared.
    ignore:
      # 8.5.x adds `xcode`, which depends on uuid@7 (GHSA-w5hq-g745-h8pq).
      # Re-verified on 2026-09-23: cli@8.5.2 still depends on xcode@^3.0.1,
      # which still depends on uuid@^7.0.3. See the dependency note in CLAUDE.md.
      #
      # This entry used to offer a second unblock condition -- "or a deliberate
      # Capacitor 6 -> 8 migration verified on a Mac (PR #148)". That clause is
      # SPENT and was removed: the 6 -> 8 migration landed in #307, and core/ios
      # are now on 8.5.2 while the cli stays at 8.4.3. Reading the clause today
      # ("the migration happened, so lift the ignore") would reintroduce three
      # moderate advisories. The only thing that unblocks this now is `xcode`
      # dropping uuid@7.
      - dependency-name: "@capacitor/cli"
        versions: ["8.5.x"]
      # (The vitest 4.1.10/4.1.11 ignore was removed once the project moved to
      # vitest 5. Both still crash npm's arborist -- re-verified -- but the 4.x
      # line is behind us, so the entry could never fire again. An ignore that
      # outlives its reason is a bug.)
      # TS 7.0 breaks typescript-eslint, which eslint-config-next pulls in:
      # "typescript-eslint does not support TS 7.0". Note `tsc --noEmit` itself
      # passes under 7.0 — only the eslint pass fails, and CI runs that
      # non-blocking, so this would have merged green and broken lint silently.
      # Scoped to 7.0.x: typescript-eslint tracks support for >=7.1 (PR #272).
      - dependency-name: "typescript"
        versions: ["7.0.x"]
      # ESLint 10 breaks eslint-plugin-react (via eslint-config-next): "Error
      # while loading rule 'react/display-name': contextOrFilename.getFilename
      # is not a function". Unblocks when those plugins support ESLint 10
      # (PR #274); eslint 11 would still surface.
      - dependency-name: "eslint"
        versions: ["10.x"]
    groups:
      # The Capacitor packages are bound by peer dependencies -- @capacitor/ios
      # requires a matching @capacitor/core -- so bumping one alone fails
      # `npm ci` with ERESOLVE (PRs #147/#148/#149, then #273/#275/#277, then
      # #304/#305, all closed unmergeable). One PR moving them together is the
      # only shape that resolves. Majors included: 6 -> 8 is the move that needs
      # making.
      #
      # THE EXCLUDE-PATTERNS BELOW ARE WHAT MAKES THIS GROUP FIRE AT ALL. This
      # block used to say the group was listed first on purpose, because "a
      # dependency joins the first group it matches" -- that is not how
      # Dependabot assigns groups, and the group had never once fired. It runs a
      # SPECIFICITY pass, and map order is irrelevant. From the updater log of
      # 2026-09-17 (job 105213613712):
      #
      #   INFO Skipping @capacitor/core for group 'capacitor'
      #        - belongs to more specific group 'production-minor-patch'
      #   WARN Skipping update group for 'capacitor' as it does not match any
      #        allowed dependencies.
      #   INFO Adding dependencies as handled: ().
      #
      # dependency-type + update-types outranks patterns, so all four
      # @capacitor/* packages were reassigned to the two catch-all groups below
      # -- which then dropped them again, because a 6 -> 8 bump is a major and
      # those groups take only minor and patch. Matching no group at all, they
      # fell through to the individual updater, which is exactly the shape the
      # group exists to prevent. Excluding them from the catch-alls leaves
      # nothing for the specificity pass to prefer.
      #
      # This is checkable, and the YAML is not the proof: after changing it,
      # read the next updater log and confirm the "more specific group" lines
      # are gone and one grouped PR exists.
      capacitor:
        patterns:
          - "@capacitor/*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: "development"
        exclude-patterns:
          - "@capacitor/*"
        update-types:
          - "minor"
          - "patch"
      production-minor-patch:
        dependency-type: "production"
        exclude-patterns:
          - "@capacitor/*"
        update-types:
          - "minor"
          - "patch"

  # Workflows pin actions by commit SHA (a tag can be moved under you); this
  # keeps the pins current, one grouped PR a month.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
