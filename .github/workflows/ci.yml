name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # Cheap and blocking, and deliberately first: a workflow file with an invalid
  # expression fails at STARTUP, which produces a run with no jobs and nothing
  # in the PR's check list — the failure mode is looking like nothing ran.
  # actionlint catches that class (bad context, bad `needs`, unknown action
  # inputs) in about a second, and shellcheck-lints the `run:` blocks too.
  workflows:
    name: workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The upstream installer, pinned by tag so both the script and the binary
      # are fixed. Not an action: no third-party action in the supply chain for
      # a one-binary linter.
      - name: Install actionlint
        run: |
          curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash" \
            | bash -s -- "$ACTIONLINT_VERSION"
        env:
          ACTIONLINT_VERSION: "1.7.12"
      - run: ./actionlint -color

  root:
    name: root (build + typecheck)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: dummy
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy.example.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy
      NEXT_PUBLIC_FIREBASE_APP_ID: dummy
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dummy
      GOOGLE_CLIENT_ID: dummy
      GOOGLE_CLIENT_SECRET: dummy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      # Non-blocking for now: ESLint surfaces a backlog (mostly the intentional
      # localStorage-hydration pattern, downgraded to warnings). Flip to
      # blocking once the remaining real findings are cleared.
      - run: npm run lint:eslint
        continue-on-error: true
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e (public surface)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: dummy
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy.example.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy
      NEXT_PUBLIC_FIREBASE_APP_ID: dummy
      NEXTAUTH_URL: http://localhost:3100
      NEXTAUTH_SECRET: dummy
      GOOGLE_CLIENT_ID: dummy
      GOOGLE_CLIENT_SECRET: dummy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Non-blocking: covers only the public surface (authed app needs real creds).
      - run: npm run e2e
        continue-on-error: true
