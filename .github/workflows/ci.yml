name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main


# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

jobs:
  # Cheap and blocking, and deliberately first: a workflow file with an invalid
  # expression fails at STARTUP, which produces a run with no jobs and nothing
  # in the PR's check list — the failure mode is looking like nothing ran.
  # actionlint catches that class (bad context, bad `needs`, unknown action
  # inputs) in about a second, and shellcheck-lints the `run:` blocks too.
  workflows:
    name: workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The upstream installer, pinned by COMMIT (a tag can be moved) so both the
      # script and the binary are fixed. ACTIONLINT_SHA is tag v1.7.12. Not an action: no third-party action in the supply chain for
      # a one-binary linter.
      - name: Install actionlint
        run: |
          curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/${ACTIONLINT_SHA}/scripts/download-actionlint.bash" \
            | bash -s -- "$ACTIONLINT_VERSION"
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA: "914e7df21a07ef503a81201c76d2b11c789d3fca"
      - run: ./actionlint -color

  root:
    name: root (build + typecheck)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: dummy
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy.example.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy
      NEXT_PUBLIC_FIREBASE_APP_ID: dummy
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dummy
      GOOGLE_CLIENT_ID: dummy
      GOOGLE_CLIENT_SECRET: dummy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      # Blocking. The error backlog is cleared; what remains is warnings, every
      # one of them the intentional localStorage-hydration pattern
      # (react-hooks/set-state-in-effect), deliberately downgraded — so a warning
      # from any other rule is new, not backlog. A new *error* now fails the
      # build — which matters because `npm run lint` is only `tsc --noEmit`, so
      # this is the sole check that catches a lint-level regression.
      - run: npm run lint:eslint
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: dummy
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy.example.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy
      NEXT_PUBLIC_FIREBASE_APP_ID: dummy
      NEXTAUTH_URL: http://localhost:3100
      NEXTAUTH_SECRET: dummy
      GOOGLE_CLIENT_ID: dummy
      GOOGLE_CLIENT_SECRET: dummy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Cache the browser downloads (~300 MB: chromium, its headless shell, and
      # ffmpeg). Keyed on the RESOLVED Playwright version from the lockfile, not
      # the `^1.62.1` range in package.json — a caret resolves to different
      # versions over time while the range string never changes, so keying on it
      # would serve one Playwright's browsers to another. A given Playwright
      # version pins its browser build, so the resolved version is the honest key.
      #
      # No `restore-keys` on purpose: a partial match would restore a DIFFERENT
      # version's browsers, which is worse than a clean miss.
      - id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Run unconditionally rather than gating on a cache hit. Gating is the
      # common recipe, but it trusts the cache to be complete: a partial or
      # corrupt restore would skip the install and break a BLOCKING gate. Running
      # always is self-healing — on a good hit it has nothing to fetch, and on a
      # bad one it just downloads, which is exactly what happens today. The worst
      # case is "no speedup", never "broken".
      # Deliberately NOT --with-deps. That flag makes Playwright shell out to
      # `apt-get update`, which reads every configured source — and this runner
      # image ships Chrome, Chromium, Edge and Firefox, so Google's apt repo is
      # one of them. On #295 that repo served a Packages.gz whose hashes did not
      # match its freshly published Release file; apt exited non-zero and the job
      # died at install, 40s in, before a test body ran. A blocking merge gate
      # should not depend on a third-party repo's publish timing. The libraries
      # --with-deps installs are already present as those browsers' own apt
      # dependencies, so the flag was buying nothing. If a future image ever does
      # lack them, Playwright says so by name at browser launch ("Host system is
      # missing dependencies") — put the flag back then, not before.
      - run: npx playwright install chromium
      # Blocking. Covers the public surface AND the authed pillars — the latter
      # via a forged next-auth cookie (see e2e/fixtures/session.ts), so no real
      # credentials are involved. playwright.config.ts sets retries + forbidOnly
      # for exactly this: a gate that can block a merge must not fail on flake,
      # and must not pass on a stray `test.only`.
      - run: npm run e2e
      # A blocking failure needs to be diagnosable without re-running locally.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
