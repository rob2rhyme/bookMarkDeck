name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  root:
    name: root (build + typecheck)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: dummy
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy.example.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy
      NEXT_PUBLIC_FIREBASE_APP_ID: dummy
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dummy
      GOOGLE_CLIENT_ID: dummy
      GOOGLE_CLIENT_SECRET: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  launcher-desktop:
    name: launcher-desktop (install)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: launcher-desktop/package-lock.json
      - run: npm ci
