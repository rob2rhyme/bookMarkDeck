name: Firestore rules

# Firestore evaluates the DEPLOYED ruleset, so the repo copy and production can
# drift silently. This workflow removes that gap: every change to the rules is
# proved against the emulator, deployed on merge to main, and then read back
# from the live project to confirm the deploy actually landed.
#
# Every step here is an npm script, so CI runs exactly what a developer runs
# locally and firebase-tools is pinned in one place (package.json).
#
# Setup (one-time, by the project owner). A Firebase project IS a Google Cloud
# project — the same project seen through two consoles — and service accounts
# live only in the Cloud one, so all of this happens there:
#   1. console.cloud.google.com, with the project from .firebaserc selected →
#      IAM & Admin → Service Accounts → + Create service account. Make a NEW
#      one; do not reuse the firebase-adminsdk-… account already listed. That
#      is a service agent for the Admin SDK — anything else using it would
#      inherit whatever is granted here, and its key could not be rotated
#      without wondering what else breaks.
#        Service account name  GitHub Actions — Firestore rules
#        Service account ID    github-actions-rules
#        Description           Deploys firestore.rules from the Firestore
#                              rules workflow in rob2rhyme/bookMarkDeck.
#                              Roles: Firebase Rules Admin + Service Usage
#                              Consumer.
#   2. Step 2 of that form is labelled "Permissions (optional)". It is not
#      optional here — grant BOTH roles, because one alone is not enough:
#        Firebase Rules Admin    roles/firebaserules.admin
#          creates rulesets and moves the cloud.firestore release
#        Service Usage Consumer  roles/serviceusage.serviceUsageConsumer
#          what firebase-tools needs to call project APIs as a service account
#          rather than a user; firebase-tools grants it to the CI accounts it
#          provisions itself (firebase/firebase-tools#6895)
#      Skipping it produces an account with no permissions and a 403 at deploy
#      time; the repair is IAM & Admin → IAM → the account → Edit → add roles.
#      Step 3, "Principals with access", is for letting people impersonate the
#      account. Leave it empty.
#   3. Click the new account's email → Keys → Add key → Create new key → JSON.
#      It downloads once and cannot be downloaded again. If Add key is greyed
#      out, the org policy iam.disableServiceAccountKeyCreation is set and this
#      workflow needs reworking for Workload Identity Federation instead —
#      which has its own firebase-tools problem (firebase/firebase-tools#10726),
#      so read that before starting.
#   4. GitHub → this repo → Settings → Secrets and variables → Actions → New
#      repository secret, named FIREBASE_SERVICE_ACCOUNT, holding that whole
#      JSON file — outer braces included. Not the account's email, name or id:
#      those are identifiers, not the credential. `npm run check:sa <the file>`
#      confirms you have the right thing before you paste, and prints nothing
#      but the account email and project. Then delete the download: the secret
#      is the only copy anything needs.
# Without that secret the deploy job SKIPS rather than fails, so the
# verification half still runs on forks and on pull requests from them.
#
# The two path lists below are duplicated on purpose: GitHub Actions does not
# support YAML anchors, so they have to be kept in sync by hand.

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - ".firebaserc"
      - "scripts/verify-firestore-rules.mjs"
      - "scripts/check-deployed-rules.mjs"
      - "scripts/check-service-account.mjs"
      - ".github/workflows/firestore-rules.yml"
  pull_request:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - ".firebaserc"
      - "scripts/verify-firestore-rules.mjs"
      - "scripts/check-deployed-rules.mjs"
      - "scripts/check-service-account.mjs"
      - ".github/workflows/firestore-rules.yml"
  # Lets the owner deploy without touching a file — the recovery path when the
  # readback reports that production has drifted from the repo.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
      # The Firestore emulator is a Java process.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      # emulators:exec boots the emulator, exports FIRESTORE_EMULATOR_HOST into
      # the script, and propagates its exit code — so a failed assertion fails
      # the job. Assertion count in CLAUDE.md; see scripts/verify-firestore-rules.mjs.
      - name: Verify rules against the emulator
        run: npm run verify:rules:emulated

  deploy:
    name: deploy (production)
    needs: verify
    # main only. workflow_dispatch can be run on ANY branch, and that branch's
    # own verify script decides whether its rules "pass" — so without the ref
    # check, an unmerged branch could put an open ruleset into production.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `npm ci` here: every command in this job is either plain node or
      # `npx -y firebase-tools`, so the project's dependencies aren't needed.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # `secrets` isn't readable from a job-level `if`, so the guard is a step
      # that every later step keys off.
      - name: Check for deploy credentials
        id: guard
        run: |
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Firestore rules not deployed::FIREBASE_SERVICE_ACCOUNT is not set, so the rules were verified but not deployed. See the header of .github/workflows/firestore-rules.yml."
          fi

      # Written to RUNNER_TEMP (wiped with the runner) rather than the
      # workspace, so it can't be swept up by a later step or an artifact upload.
      # The key path is exported through GITHUB_ENV rather than set as job-level
      # `env`: the `runner` context isn't available there, and hardcoding /tmp
      # would be worse.
      # The validation is a script, not an inline JSON.parse, because a parser's
      # error quotes a FRAGMENT of its input — and a fragment doesn't match the
      # secret masker, so a truncated key would print part of itself into a log.
      - name: Write the service-account key
        if: steps.guard.outputs.present == 'true'
        run: |
          umask 077
          key="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$key" >> "$GITHUB_ENV"
          node scripts/check-service-account.mjs "$key"

      # Project comes from .firebaserc; `--only firestore:rules` leaves indexes
      # alone. GOOGLE_APPLICATION_CREDENTIALS is the supported auth path —
      # `--token`/FIREBASE_TOKEN is deprecated, so it isn't used here.
      - name: Deploy firestore.rules
        if: steps.guard.outputs.present == 'true'
        run: npm run deploy:rules

      # A deploy can report success without changing the live ruleset, so
      # success isn't taken on trust: read the released ruleset back and compare
      # it with the file in this commit.
      - name: Confirm production is running this ruleset
        if: steps.guard.outputs.present == 'true'
        run: npm run check:rules

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
